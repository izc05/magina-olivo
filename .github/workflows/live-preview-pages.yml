name: Mágina Olivo live preview

on:
  push:
    branches:
      - feat/visual-v2-foundation
      - feat/real-news-v1
      - feat/cooperatives-alerts-v1
      - feat/market-real-v1
      - main
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-preview-v3
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Refresh real news feed
        run: npm run news:sync

      - name: Validate real news feed
        run: node scripts/validate-news.mjs

      - name: Refresh official alerts
        run: npm run alerts:sync

      - name: Validate official alerts
        run: node scripts/validate-alerts.mjs

      - name: Refresh official market prices
        run: npm run market:sync

      - name: Validate official market prices
        run: node scripts/validate-market.mjs

      - name: Validate cooperative directory
        run: node scripts/validate-cooperatives.mjs

      - name: Generate approved photography
        run: npm run photos:sync

      - name: Build for GitHub Pages
        run: npm run build -- --base=/magina-olivo/

      - name: Install Chromium for navigation smoke
        run: npx playwright install --with-deps chromium

      - name: Validate Mágina data flows
        run: node scripts/magina-data-smoke.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    environment:
      name: pages-preview
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
