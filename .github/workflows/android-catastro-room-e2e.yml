name: Android Catastro Room E2E

on:
  workflow_dispatch:
  push:
    branches:
      - "feat/android-map-catastro-v1"
    paths:
      - "app/**"
      - "supabase/functions/catastro-map/**"
      - ".github/workflows/android-catastro-room-e2e.yml"
  pull_request:
    paths:
      - "app/**"
      - "supabase/functions/catastro-map/**"
      - ".github/workflows/android-catastro-room-e2e.yml"

concurrency:
  group: android-catastro-room-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SUPABASE_URL: https://zzelvbcuxsboafibfxch.supabase.co
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Require Supabase publishable key
        shell: bash
        run: |
          if [[ -z "${SUPABASE_PUBLISHABLE_KEY}" ]]; then
            echo "::error::Missing GitHub Actions secret SUPABASE_PUBLISHABLE_KEY"
            exit 1
          fi

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Catastro to Room E2E
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            set -eu

            if gradle :app:connectedDebugAndroidTest --info --stacktrace > /tmp/catastro-first-attempt.log 2>&1; then
              cat /tmp/catastro-first-attempt.log
              exit 0
            fi

            first_status=$?
            cat /tmp/catastro-first-attempt.log

            if ! grep -Eqi 'Failed to find ColorBuffer|device offline|adb.*failed|Unable to connect to adb|emulator.*disconnect|transport error' /tmp/catastro-first-attempt.log; then
              echo "::error::Catastro E2E failed for a non-infrastructure reason; not retrying"
              exit "$first_status"
            fi

            echo "::warning::Detected emulator/ADB infrastructure failure; performing one controlled retry"
            adb kill-server >/dev/null 2>&1 || true
            sleep 2
            adb start-server
            adb wait-for-device

            i=0
            while [ "$i" -lt 20 ]; do
              if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
                break
              fi
              i=$((i + 1))
              sleep 2
            done

            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" != "1" ]; then
              echo "::error::Emulator did not recover before retry"
              exit "$first_status"
            fi

            gradle :app:connectedDebugAndroidTest --rerun-tasks --info --stacktrace

      - name: Upload Android E2E test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-catastro-room-e2e-reports
          if-no-files-found: ignore
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
            /tmp/catastro-first-attempt.log
