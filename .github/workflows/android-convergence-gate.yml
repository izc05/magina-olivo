name: Android Convergence Gate

on:
  push:
    branches:
      - integration/android-v1
  pull_request:
    branches:
      - integration/android-v1
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "supabase/**"
      - ".github/workflows/android-convergence-gate.yml"
      - "docs/ANDROID_INTEGRATION_V1.md"
      - "docs/ANDROID_V1_CONFLICT_MATRIX.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-convergence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  convergence:
    name: Android Convergence Gate
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Android SDK 36
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Repository sanity
        shell: bash
        run: |
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f AGENTS.md
          test -f .github/copilot-instructions.md
          if git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- ':!*.lock'; then
            echo "Unresolved merge markers found"
            exit 1
          fi

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build debug
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify convergence domains
        shell: bash
        run: |
          test -d app/src/main/java/com/isivolt/maginaolivo/domain/catastro
          test -d app/src/main/java/com/isivolt/maginaolivo/data/sync
          echo "Catastro + Sync baseline present."
          if [ -d app/src/main/java/com/isivolt/maginaolivo/domain/weather ]; then
            echo "Weather domain present."
          else
            echo "Weather not integrated yet; allowed while PR #191 remains Draft."
          fi

      - name: No privileged Supabase key in Android sources
        shell: bash
        run: |
          if git grep -n -E '(service[_-]?role|SUPABASE_SERVICE_ROLE_KEY)' -- app; then
            echo "Privileged Supabase credential reference found in Android app."
            exit 1
          fi
