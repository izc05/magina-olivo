name: magina-olivo-staging

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: magina_olivo
      POSTGRES_USER: magina
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - "${MAGINA_POSTGRES_DATA_DIR:-magina_staging_postgres}:/var/lib/postgresql"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U magina -d magina_olivo"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - data

  migrate:
    image: magina-olivo-runtime:${MAGINA_IMAGE_TAG:-local}
    command: >-
      sh -c "npm run auth:migrate --workspace @magina/api &&
      npm run db:migrate --workspace @magina/api"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?set BETTER_AUTH_URL}
      BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS:?set BETTER_AUTH_TRUSTED_ORIGINS}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - data

  api:
    image: magina-olivo-runtime:${MAGINA_IMAGE_TAG:-local}
    command: ["npm", "run", "start", "--workspace", "@magina/api"]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?set BETTER_AUTH_URL}
      BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS:?set BETTER_AUTH_TRUSTED_ORIGINS}
      PUBLIC_GROWTH_MEASUREMENT_ENABLED: ${PUBLIC_GROWTH_MEASUREMENT_ENABLED:-false}
      AEMET_API_KEY: ${AEMET_API_KEY:?set AEMET_API_KEY}
      AUTH_MAIL_TRANSPORT: ${AUTH_MAIL_TRANSPORT:-disabled}
      AUTH_MAIL_FROM: ${AUTH_MAIL_FROM:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      PRIVATE_STORAGE_DRIVER: s3
      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:?set OBJECT_STORAGE_ENDPOINT}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:?set OBJECT_STORAGE_BUCKET}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-auto}
      OBJECT_STORAGE_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY_ID:?set OBJECT_STORAGE_ACCESS_KEY_ID}
      OBJECT_STORAGE_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_ACCESS_KEY:?set OBJECT_STORAGE_SECRET_ACCESS_KEY}
      OBJECT_STORAGE_FORCE_PATH_STYLE: ${OBJECT_STORAGE_FORCE_PATH_STYLE:-true}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 10s
    networks:
      - edge
      - data

  worker:
    image: magina-olivo-runtime:${MAGINA_IMAGE_TAG:-local}
    command: ["npm", "run", "start", "--workspace", "@magina/worker"]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      WORKER_POLL_MS: ${WORKER_POLL_MS:-5000}
      WORKER_RETRY_SECONDS: ${WORKER_RETRY_SECONDS:-5}
      WORKER_LEASE_SECONDS: ${WORKER_LEASE_SECONDS:-120}
      ACCOUNT_EXPORT_TTL_HOURS: ${ACCOUNT_EXPORT_TTL_HOURS:-24}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - edge
      - data

  web:
    image: magina-olivo-web:${MAGINA_IMAGE_TAG:-local}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${STAGING_BIND:-127.0.0.1:8088}:8080"
    networks:
      - edge

volumes:
  magina_staging_postgres:

networks:
  edge:
  data:
    internal: true
