name: Mágina Olivo convergence preview validation

on:
  push:
    branches:
      - feat/pre-minipc-convergence-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: magina-olivo-convergence-pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout convergence branch
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck workspaces
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build isolated demo preview
        env:
          VITE_BASE_PATH: /magina-olivo/
          VITE_DEMO_MODE: "true"
        run: npm run build --workspace @magina/web

      - name: Keep convergence off public Pages
        run: echo "Canonical public GitHub Pages remains reserved for the original Visual V2 review app."
