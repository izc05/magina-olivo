name: Catastro Edge CI

on:
  push:
    branches:
      - "feat/android-map-catastro-v1"
    paths:
      - "supabase/functions/catastro-map/**"
      - ".github/workflows/catastro-edge-ci.yml"
  pull_request:
    paths:
      - "supabase/functions/catastro-map/**"
      - ".github/workflows/catastro-edge-ci.yml"

concurrency:
  group: catastro-edge-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Deno 2.9.7
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.7

      - name: Type-check Catastro Edge Function
        run: deno check supabase/functions/catastro-map/index.ts

      - name: Catastro adapter tests
        run: deno test --allow-read supabase/functions/catastro-map/

      - name: Catastro E2E helper tests
        run: deno test supabase/e2e/catastro-e2e_test.ts
