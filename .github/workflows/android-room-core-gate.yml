name: Android Room Core Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/android-room-core-gate.yml"

concurrency:
  group: android-room-core-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  room-core:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Room v2 to v3 migration and repository gate
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            gradle :app:connectedDebugAndroidTest               -Pandroid.testInstrumentationRunnerArguments.class=com.isivolt.maginaolivo.data.local.RoomCoreMigrationTest               --stacktrace

      - name: Upload Room gate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-room-core-reports
          if-no-files-found: ignore
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
