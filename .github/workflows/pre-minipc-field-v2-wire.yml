name: Wire Pre-MiniPC Field V2

on:
  push:
    branches:
      - feat/pre-minipc-convergence-v1
    paths:
      - .github/workflows/pre-minipc-field-v2-wire.yml

permissions:
  contents: write

jobs:
  wire-field-v2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout convergence branch
        uses: actions/checkout@v4
        with:
          ref: feat/pre-minipc-convergence-v1

      - name: Wire FieldDashboardV2 over real field components
        shell: python
        run: |
          from pathlib import Path
          import re

          app_path = Path('apps/web/src/App.tsx')
          app = app_path.read_text(encoding='utf-8')

          dashboard_import = "import { FieldDashboardV2 } from './FieldDashboardV2';\n"
          notebook_import = "import { FieldNotebook } from './FieldNotebook.tsx';\n"
          if dashboard_import not in app:
              if notebook_import not in app:
                  raise SystemExit('FieldNotebook import anchor not found')
              app = app.replace(notebook_import, dashboard_import + notebook_import, 1)

          field_call_anchor = "            reloadPlots={() => loadPlots(selectedFarmId)}\n"
          navigate_line = "            onNavigate={(next) => setTab(next)}\n"
          if navigate_line not in app:
              if field_call_anchor not in app:
                  raise SystemExit('FieldTab call anchor not found')
              app = app.replace(field_call_anchor, field_call_anchor + navigate_line, 1)

          replacement = '''function FieldTab({ holdings, selectedHolding, farms, selectedFarm, selectedFarmId, plots, busy, setSelectedFarmId, onNavigate, runAction, reloadHoldings, reloadHoldingData, reloadPlots }: { holdings: Holding[]; selectedHolding: Holding | null; farms: Farm[]; selectedFarm: Farm | null; selectedFarmId: string; plots: Plot[]; busy: boolean; setSelectedFarmId: (id: string) => void; onNavigate: (tab: 'campaign') => void; runAction: ActionRunner; reloadHoldings: () => Promise<void>; reloadHoldingData: () => Promise<void>; reloadPlots: () => Promise<void> }) {
  return (
    <FieldDashboardV2
      holdings={holdings}
      selectedHolding={selectedHolding}
      farms={farms}
      selectedFarm={selectedFarm}
      selectedFarmId={selectedFarmId}
      plots={plots}
      setSelectedFarmId={setSelectedFarmId}
      onNavigate={onNavigate}
      createHolding={holdings.length === 0 ? <CreateHoldingCard busy={busy} runAction={runAction} onCreated={reloadHoldings} /> : null}
      createFarm={selectedHolding ? <CreateFarmCard holdingId={selectedHolding.id} busy={busy} runAction={runAction} onCreated={reloadHoldingData} /> : null}
      createPlot={selectedFarm ? <CreatePlotCard farmId={selectedFarm.id} busy={busy} runAction={runAction} onCreated={reloadPlots} /> : null}
      notebook={selectedFarm && selectedHolding ? <FieldNotebook holdingId={selectedHolding.id} farmId={selectedFarm.id} plots={plots} /> : null}
    />
  );
}

function CampaignTab'''

          pattern = r'function FieldTab\([\s\S]*?\n}\n\nfunction CampaignTab'
          app, count = re.subn(pattern, replacement, app, count=1)
          if count != 1:
              raise SystemExit('FieldTab function block not found')
          app_path.write_text(app, encoding='utf-8')

          main_path = Path('apps/web/src/main.tsx')
          main = main_path.read_text(encoding='utf-8')
          css_import = "import './field-dashboard-v2.css';\n"
          css_anchor = "import './field-v2-integration.css';\n"
          if css_import not in main:
              if css_anchor not in main:
                  raise SystemExit('field-v2 CSS anchor not found')
              main = main.replace(css_anchor, css_anchor + css_import, 1)
          main_path.write_text(main, encoding='utf-8')

      - name: Commit field wiring
        run: |
          git config user.name "IsiVoltPro Mantenimiento"
          git config user.email "isiciozafracantos@gmail.com"
          git add apps/web/src/App.tsx apps/web/src/main.tsx
          if git diff --cached --quiet; then
            echo "Mi Campo V2 already wired"
            exit 0
          fi
          git commit -m "feat(convergence): wire Visual V2 Mi Campo to real API data"
          git push origin HEAD:feat/pre-minipc-convergence-v1
