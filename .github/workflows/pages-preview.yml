name: Mágina Olivo convergence preview

on:
  push:
    branches:
      - feat/pre-minipc-convergence-v1
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: magina-olivo-convergence-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout convergence branch
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck workspaces
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build isolated demo preview
        env:
          VITE_BASE_PATH: /magina-olivo/
          VITE_DEMO_MODE: "true"
        run: npm run build --workspace @magina/web

      - name: Prepare SPA fallback
        run: |
          cp apps/web/dist/index.html apps/web/dist/404.html
          touch apps/web/dist/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web/dist

  deploy:
    environment:
      name: pages-original-review
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy convergence demo
        id: deployment
        uses: actions/deploy-pages@v4
