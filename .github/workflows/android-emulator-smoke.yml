name: Android Emulator Smoke

on:
  push:
    branches:
      - "feat/android-map-catastro-v1"
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-emulator-smoke.yml"
  pull_request:
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-emulator-smoke.yml"

concurrency:
  group: android-emulator-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot emulator and smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -euo pipefail

            gradle :app:installDebug --stacktrace

            adb logcat -c
            adb shell am force-stop com.isivolt.maginaolivo
            adb shell am start -W -n com.isivolt.maginaolivo/.MainActivity
            sleep 3

            adb shell uiautomator dump /sdcard/home.xml
            adb pull /sdcard/home.xml /tmp/home.xml

            python3 - <<'PY'
            import re
            import subprocess
            import xml.etree.ElementTree as ET

            root = ET.parse("/tmp/home.xml").getroot()
            node = next(
                (
                    item
                    for item in root.iter("node")
                    if item.attrib.get("text") == "Abrir mapa de parcelas"
                ),
                None,
            )
            if node is None:
                raise SystemExit("HOME_MAP_BUTTON_NOT_FOUND")

            bounds = node.attrib.get("bounds", "")
            match = re.fullmatch(r"\[(\d+),(\d+)\]\[(\d+),(\d+)\]", bounds)
            if match is None:
                raise SystemExit(f"INVALID_BUTTON_BOUNDS:{bounds}")

            x1, y1, x2, y2 = map(int, match.groups())
            x = (x1 + x2) // 2
            y = (y1 + y2) // 2
            subprocess.run(["adb", "shell", "input", "tap", str(x), str(y)], check=True)
            PY

            sleep 5
            adb shell uiautomator dump /sdcard/map.xml
            adb pull /sdcard/map.xml /tmp/map.xml

            python3 - <<'PY'
            import xml.etree.ElementTree as ET

            root = ET.parse("/tmp/map.xml").getroot()
            texts = {item.attrib.get("text", "") for item in root.iter("node")}

            required = {"Volver", "Mi ubicación", "PNOA", "Catastro"}
            missing = sorted(required - texts)
            if missing:
                raise SystemExit("MAP_CONTROLS_MISSING:" + ",".join(missing))

            print("ANDROID_MAP_SMOKE_OK")
            PY

            adb exec-out screencap -p > /tmp/map-smoke.png
            adb logcat -d > /tmp/map-smoke-logcat.txt

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-map-smoke-evidence
          if-no-files-found: ignore
          path: |
            /tmp/home.xml
            /tmp/map.xml
            /tmp/map-smoke.png
            /tmp/map-smoke-logcat.txt
