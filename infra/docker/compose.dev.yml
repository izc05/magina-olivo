services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: magina_olivo
      POSTGRES_USER: magina
      POSTGRES_PASSWORD: magina_local
    ports:
      - "5432:5432"
    volumes:
      # PostgreSQL 18 stores clusters under a version-specific subdirectory.
      # Mount its parent directory so a fresh local volume can initialize.
      - magina_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U magina -d magina_olivo"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  magina_postgres_data:
