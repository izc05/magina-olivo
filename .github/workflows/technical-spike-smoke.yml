name: Technical Spike Smoke

on:
  push:
    branches:
      - feat/technical-spike-v1
  pull_request:
    branches:
      - feat/foundation-v1
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: technical-spike-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: magina_olivo
          POSTGRES_USER: magina
          POSTGRES_PASSWORD: magina_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U magina -d magina_olivo"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://magina:magina_ci@127.0.0.1:5432/magina_olivo
      BETTER_AUTH_SECRET: ci-only-secret-for-magina-olivo-technical-spike-2026
      BETTER_AUTH_URL: http://127.0.0.1:3001
      BETTER_AUTH_TRUSTED_ORIGINS: http://127.0.0.1:3001,http://localhost:5173
      HOST: 127.0.0.1
      PORT: 3001
      LOG_LEVEL: warn

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck workspaces
        run: npm run typecheck

      - name: Migrate Better Auth
        run: npm run auth:migrate --workspace @magina/api

      - name: Migrate business schema
        run: npm run db:migrate

      - name: Build web PWA
        run: npm run build --workspace @magina/web

      - name: Start API
        run: |
          npm run start --workspace @magina/api > /tmp/magina-api.log 2>&1 &
          echo $! > /tmp/magina-api.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3001/health/ready > /tmp/ready.json; then
              cat /tmp/ready.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/magina-api.log
          exit 1

      - name: Verify authentication round trip
        run: |
          signup_status=$(curl --silent --output /tmp/signup-a.json --write-out "%{http_code}" \
            --cookie-jar /tmp/cookies-a.txt \
            --header 'content-type: application/json' \
            --data '{"name":"Farmer A","email":"farmer-a@example.com","password":"correct-horse-battery-staple"}' \
            http://127.0.0.1:3001/api/auth/sign-up/email)
          cat /tmp/signup-a.json
          test "$signup_status" = "200"

          me_status=$(curl --silent --output /tmp/me-a.json --write-out "%{http_code}" \
            --cookie /tmp/cookies-a.txt \
            http://127.0.0.1:3001/api/v1/me)
          cat /tmp/me-a.json
          test "$me_status" = "200"
          grep -q 'farmer-a@example.com' /tmp/me-a.json

      - name: Verify holding isolation
        run: |
          unauth_status=$(curl --silent --output /tmp/holdings-unauth.json --write-out "%{http_code}" \
            http://127.0.0.1:3001/api/v1/holdings)
          test "$unauth_status" = "401"

          create_a_status=$(curl --silent --output /tmp/holding-a.json --write-out "%{http_code}" \
            --cookie /tmp/cookies-a.txt \
            --header 'content-type: application/json' \
            --data '{"name":"Holding Pilot A","municipality":"Bedmar","province":"Jaen"}' \
            http://127.0.0.1:3001/api/v1/holdings)
          cat /tmp/holding-a.json
          test "$create_a_status" = "201"
          grep -q 'Holding Pilot A' /tmp/holding-a.json

          list_a_status=$(curl --silent --output /tmp/holdings-a.json --write-out "%{http_code}" \
            --cookie /tmp/cookies-a.txt \
            http://127.0.0.1:3001/api/v1/holdings)
          cat /tmp/holdings-a.json
          test "$list_a_status" = "200"
          grep -q 'Holding Pilot A' /tmp/holdings-a.json

          signup_b_status=$(curl --silent --output /tmp/signup-b.json --write-out "%{http_code}" \
            --cookie-jar /tmp/cookies-b.txt \
            --header 'content-type: application/json' \
            --data '{"name":"Farmer B","email":"farmer-b@example.com","password":"correct-horse-battery-staple"}' \
            http://127.0.0.1:3001/api/auth/sign-up/email)
          cat /tmp/signup-b.json
          test "$signup_b_status" = "200"

          list_b_before_status=$(curl --silent --output /tmp/holdings-b-before.json --write-out "%{http_code}" \
            --cookie /tmp/cookies-b.txt \
            http://127.0.0.1:3001/api/v1/holdings)
          cat /tmp/holdings-b-before.json
          test "$list_b_before_status" = "200"
          if grep -q 'Holding Pilot A' /tmp/holdings-b-before.json; then
            echo 'Cross-holding data leak: Farmer B can see Farmer A holding'
            exit 1
          fi

          create_b_status=$(curl --silent --output /tmp/holding-b.json --write-out "%{http_code}" \
            --cookie /tmp/cookies-b.txt \
            --header 'content-type: application/json' \
            --data '{"name":"Holding Pilot B","municipality":"Huelma","province":"Jaen"}' \
            http://127.0.0.1:3001/api/v1/holdings)
          cat /tmp/holding-b.json
          test "$create_b_status" = "201"

          curl --fail --silent --cookie /tmp/cookies-b.txt \
            http://127.0.0.1:3001/api/v1/holdings > /tmp/holdings-b.json
          grep -q 'Holding Pilot B' /tmp/holdings-b.json
          if grep -q 'Holding Pilot A' /tmp/holdings-b.json; then
            echo 'Cross-holding data leak after Farmer B creates own holding'
            exit 1
          fi

          curl --fail --silent --cookie /tmp/cookies-a.txt \
            http://127.0.0.1:3001/api/v1/holdings > /tmp/holdings-a-after.json
          grep -q 'Holding Pilot A' /tmp/holdings-a-after.json
          if grep -q 'Holding Pilot B' /tmp/holdings-a-after.json; then
            echo 'Cross-holding data leak: Farmer A can see Farmer B holding'
            exit 1
          fi

      - name: Stop API
        if: always()
        run: |
          if [ -f /tmp/magina-api.pid ]; then
            kill "$(cat /tmp/magina-api.pid)" 2>/dev/null || true
          fi
          cat /tmp/magina-api.log 2>/dev/null || true
