name: Technical Spike Smoke

on:
  pull_request:
    branches:
      - feat/foundation-v1
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: technical-spike-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: magina_olivo
          POSTGRES_USER: magina
          POSTGRES_PASSWORD: magina_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U magina -d magina_olivo"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://magina:magina_ci@127.0.0.1:5432/magina_olivo
      BETTER_AUTH_SECRET: ci-only-secret-for-magina-olivo-technical-spike-2026
      BETTER_AUTH_URL: http://127.0.0.1:3001
      BETTER_AUTH_TRUSTED_ORIGINS: http://127.0.0.1:3001,http://localhost:5173
      DOCUMENT_STORAGE_DIR: /tmp/magina-private-documents
      HOST: 127.0.0.1
      PORT: 3001
      LOG_LEVEL: warn

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck workspaces
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Migrate Better Auth
        run: npm run auth:migrate --workspace @magina/api

      - name: Migrate business schema
        run: npm run db:migrate

      - name: Build web PWA
        run: npm run build --workspace @magina/web

      - name: Start API
        run: |
          npm run start --workspace @magina/api > /tmp/magina-api.log 2>&1 &
          echo $! > /tmp/magina-api.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3001/health/ready > /tmp/ready.json; then
              cat /tmp/ready.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/magina-api.log
          exit 1

      - name: Verify authentication round trip
        run: |
          signup_status=$(curl --silent --output /tmp/signup-a.json --write-out "%{http_code}" \
            --cookie-jar /tmp/cookies-a.txt \
            --header 'content-type: application/json' \
            --data '{"name":"Farmer A","email":"farmer-a@example.com","password":"correct-horse-battery-staple"}' \
            http://127.0.0.1:3001/api/auth/sign-up/email)
          cat /tmp/signup-a.json
          test "$signup_status" = "200"

          me_status=$(curl --silent --output /tmp/me-a.json --write-out "%{http_code}" \
            --cookie /tmp/cookies-a.txt \
            http://127.0.0.1:3001/api/v1/me)
          cat /tmp/me-a.json
          test "$me_status" = "200"
          grep -q 'farmer-a@example.com' /tmp/me-a.json

      - name: Verify holding isolation
        run: |
          unauth_status=$(curl --silent --output /tmp/holdings-unauth.json --write-out "%{http_code}" \
            http://127.0.0.1:3001/api/v1/holdings)
          test "$unauth_status" = "401"

          create_a_status=$(curl --silent --output /tmp/holding-a.json --write-out "%{http_code}" \
            --cookie /tmp/cookies-a.txt \
            --header 'content-type: application/json' \
            --data '{"name":"Holding Pilot A","municipality":"Bedmar","province":"Jaen"}' \
            http://127.0.0.1:3001/api/v1/holdings)
          cat /tmp/holding-a.json
          test "$create_a_status" = "201"
          grep -q 'Holding Pilot A' /tmp/holding-a.json

          signup_b_status=$(curl --silent --output /tmp/signup-b.json --write-out "%{http_code}" \
            --cookie-jar /tmp/cookies-b.txt \
            --header 'content-type: application/json' \
            --data '{"name":"Farmer B","email":"farmer-b@example.com","password":"correct-horse-battery-staple"}' \
            http://127.0.0.1:3001/api/auth/sign-up/email)
          cat /tmp/signup-b.json
          test "$signup_b_status" = "200"

          list_b_before_status=$(curl --silent --output /tmp/holdings-b-before.json --write-out "%{http_code}" \
            --cookie /tmp/cookies-b.txt \
            http://127.0.0.1:3001/api/v1/holdings)
          test "$list_b_before_status" = "200"
          if grep -q 'Holding Pilot A' /tmp/holdings-b-before.json; then
            echo 'Cross-holding data leak: Farmer B can see Farmer A holding'
            exit 1
          fi

          create_b_status=$(curl --silent --output /tmp/holding-b.json --write-out "%{http_code}" \
            --cookie /tmp/cookies-b.txt \
            --header 'content-type: application/json' \
            --data '{"name":"Holding Pilot B","municipality":"Huelma","province":"Jaen"}' \
            http://127.0.0.1:3001/api/v1/holdings)
          test "$create_b_status" = "201"

          curl --fail --silent --cookie /tmp/cookies-a.txt \
            http://127.0.0.1:3001/api/v1/holdings > /tmp/holdings-a-after.json
          curl --fail --silent --cookie /tmp/cookies-b.txt \
            http://127.0.0.1:3001/api/v1/holdings > /tmp/holdings-b-after.json

          grep -q 'Holding Pilot A' /tmp/holdings-a-after.json
          grep -q 'Holding Pilot B' /tmp/holdings-b-after.json
          if grep -q 'Holding Pilot B' /tmp/holdings-a-after.json || grep -q 'Holding Pilot A' /tmp/holdings-b-after.json; then
            echo 'Cross-holding data leak detected'
            exit 1
          fi

      - name: Verify field to delivery vertical slice
        run: |
          HOLDING_A=$(node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('/tmp/holdings-a-after.json','utf8'));process.stdout.write(j.items.find(x=>x.name==='Holding Pilot A').id)")

          farm_status=$(curl --silent --output /tmp/farm-a.json --write-out "%{http_code}" \
            --cookie /tmp/cookies-a.txt \
            --header 'content-type: application/json' \
            --data '{"name":"Las Vinas","areaHa":3.25}' \
            "http://127.0.0.1:3001/api/v1/holdings/$HOLDING_A/farms")
          cat /tmp/farm-a.json
          test "$farm_status" = "201"
          FARM_A=$(node -e "const fs=require('fs');process.stdout.write(JSON.parse(fs.readFileSync('/tmp/farm-a.json','utf8')).id)")

          foreign_farm_status=$(curl --silent --output /tmp/farm-a-by-b.json --write-out "%{http_code}" \
            --cookie /tmp/cookies-b.txt \
            "http://127.0.0.1:3001/api/v1/holdings/$HOLDING_A/farms")
          test "$foreign_farm_status" = "404"

          plot_status=$(curl --silent --output /tmp/plot-a.json --write-out "%{http_code}" \
            --cookie /tmp/cookies-a.txt \
            --header 'content-type: application/json' \
            --data '{"name":"Parcela Norte","areaHa":1.75,"irrigationType":"dryland","oliveTreeCount":210}' \
            "http://127.0.0.1:3001/api/v1/farms/$FARM_A/plots")
          cat /tmp/plot-a.json
          test "$plot_status" = "201"
          PLOT_A=$(node -e "const fs=require('fs');process.stdout.write(JSON.parse(fs.readFileSync('/tmp/plot-a.json','utf8')).id)")

          foreign_plot_status=$(curl --silent --output /tmp/plot-a-by-b.json --write-out "%{http_code}" \
            --cookie /tmp/cookies-b.txt \
            "http://127.0.0.1:3001/api/v1/farms/$FARM_A/plots")
          test "$foreign_plot_status" = "404"

          campaign_status=$(curl --silent --output /tmp/campaign-a.json --write-out "%{http_code}" \
            --cookie /tmp/cookies-a.txt \
            --header 'content-type: application/json' \
            --data '{"name":"Campana 2026/27","seasonStartYear":2026,"startDate":"2026-10-01"}' \
            "http://127.0.0.1:3001/api/v1/holdings/$HOLDING_A/campaigns")
          cat /tmp/campaign-a.json
          test "$campaign_status" = "201"
          CAMPAIGN_A=$(node -e "const fs=require('fs');process.stdout.write(JSON.parse(fs.readFileSync('/tmp/campaign-a.json','utf8')).id)")

          DELIVERY_BODY=$(printf '{"deliveredAt":"2026-11-18T18:42:00+01:00","kilograms":"1842.000","customDestination":"Cooperativa piloto","farmId":"%s","plotId":"%s","ticketNumber":"004281"}' "$FARM_A" "$PLOT_A")
          IDEMPOTENCY_KEY='11111111-1111-4111-8111-111111111111'

          delivery_status=$(curl --silent --output /tmp/delivery-a.json --write-out "%{http_code}" \
            --cookie /tmp/cookies-a.txt \
            --header 'content-type: application/json' \
            --header "Idempotency-Key: $IDEMPOTENCY_KEY" \
            --data "$DELIVERY_BODY" \
            "http://127.0.0.1:3001/api/v1/campaigns/$CAMPAIGN_A/deliveries")
          cat /tmp/delivery-a.json
          test "$delivery_status" = "201"
          grep -q '1842.000' /tmp/delivery-a.json
          DELIVERY_A=$(node -e "const fs=require('fs');process.stdout.write(JSON.parse(fs.readFileSync('/tmp/delivery-a.json','utf8')).id)")

          replay_status=$(curl --silent --output /tmp/delivery-replay.json --write-out "%{http_code}" \
            --cookie /tmp/cookies-a.txt \
            --header 'content-type: application/json' \
            --header "Idempotency-Key: $IDEMPOTENCY_KEY" \
            --data "$DELIVERY_BODY" \
            "http://127.0.0.1:3001/api/v1/campaigns/$CAMPAIGN_A/deliveries")
          test "$replay_status" = "201"
          DELIVERY_REPLAY=$(node -e "const fs=require('fs');process.stdout.write(JSON.parse(fs.readFileSync('/tmp/delivery-replay.json','utf8')).id)")
          test "$DELIVERY_A" = "$DELIVERY_REPLAY"

          curl --fail --silent --cookie /tmp/cookies-a.txt \
            "http://127.0.0.1:3001/api/v1/campaigns/$CAMPAIGN_A/deliveries" > /tmp/deliveries-a.json
          DELIVERY_COUNT=$(node -e "const fs=require('fs');process.stdout.write(String(JSON.parse(fs.readFileSync('/tmp/deliveries-a.json','utf8')).items.length))")
          test "$DELIVERY_COUNT" = "1"

          conflict_status=$(curl --silent --output /tmp/idempotency-conflict.json --write-out "%{http_code}" \
            --cookie /tmp/cookies-a.txt \
            --header 'content-type: application/json' \
            --header "Idempotency-Key: $IDEMPOTENCY_KEY" \
            --data '{"deliveredAt":"2026-11-18T18:42:00+01:00","kilograms":"1900.000","customDestination":"Cooperativa piloto"}' \
            "http://127.0.0.1:3001/api/v1/campaigns/$CAMPAIGN_A/deliveries")
          cat /tmp/idempotency-conflict.json
          test "$conflict_status" = "409"
          grep -q 'IDEMPOTENCY_KEY_REUSED' /tmp/idempotency-conflict.json

          foreign_delivery_status=$(curl --silent --output /tmp/delivery-list-by-b.json --write-out "%{http_code}" \
            --cookie /tmp/cookies-b.txt \
            "http://127.0.0.1:3001/api/v1/campaigns/$CAMPAIGN_A/deliveries")
          test "$foreign_delivery_status" = "404"

          echo "$DELIVERY_A" > /tmp/delivery-a.id

      - name: Verify delayed yield and correction history
        run: |
          DELIVERY_A=$(cat /tmp/delivery-a.id)

          result_status=$(curl --silent --output /tmp/result-a.json --write-out "%{http_code}" \
            --cookie /tmp/cookies-a.txt \
            --header 'content-type: application/json' \
            --data '{"value":"21.7000","measuredAt":"2026-11-20T10:00:00+01:00"}' \
            "http://127.0.0.1:3001/api/v1/deliveries/$DELIVERY_A/results")
          cat /tmp/result-a.json
          test "$result_status" = "201"
          grep -q '21.7000' /tmp/result-a.json

          foreign_result_status=$(curl --silent --output /tmp/results-by-b.json --write-out "%{http_code}" \
            --cookie /tmp/cookies-b.txt \
            "http://127.0.0.1:3001/api/v1/deliveries/$DELIVERY_A/results")
          test "$foreign_result_status" = "404"

          correction_status=$(curl --silent --output /tmp/result-correction.json --write-out "%{http_code}" \
            --cookie /tmp/cookies-a.txt \
            --header 'content-type: application/json' \
            --data '{"value":"21.9000","measuredAt":"2026-11-20T12:00:00+01:00","notes":"Corrected cooperative result"}' \
            "http://127.0.0.1:3001/api/v1/deliveries/$DELIVERY_A/results")
          cat /tmp/result-correction.json
          test "$correction_status" = "201"
          grep -q '21.9000' /tmp/result-correction.json

          curl --fail --silent --cookie /tmp/cookies-a.txt \
            "http://127.0.0.1:3001/api/v1/deliveries/$DELIVERY_A/results" > /tmp/results-a.json
          cat /tmp/results-a.json
          node - <<'NODE'
          const fs = require('fs');
          const { items } = JSON.parse(fs.readFileSync('/tmp/results-a.json', 'utf8'));
          if (items.length !== 2) throw new Error(`Expected two yield history rows, got ${items.length}`);
          const oldValue = items.find((item) => item.value === '21.7000');
          const currentValue = items.find((item) => item.value === '21.9000');
          if (!oldValue || oldValue.status !== 'superseded') throw new Error('Old yield was not superseded');
          if (!currentValue || currentValue.status !== 'current') throw new Error('Corrected yield is not current');
          NODE

      - name: Verify private ticket isolation
        run: |
          HOLDING_A=$(node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('/tmp/holdings-a-after.json','utf8'));process.stdout.write(j.items.find(x=>x.name==='Holding Pilot A').id)")
          DELIVERY_A=$(cat /tmp/delivery-a.id)
          printf 'ticket-004281-private' > /tmp/ticket-004281.txt

          upload_status=$(curl --silent --output /tmp/document-a.json --write-out "%{http_code}" \
            --cookie /tmp/cookies-a.txt \
            --header 'content-type: application/octet-stream' \
            --data-binary @/tmp/ticket-004281.txt \
            "http://127.0.0.1:3001/api/v1/holdings/$HOLDING_A/documents?filename=ticket-004281.txt&mimeType=text%2Fplain&documentType=ticket&deliveryId=$DELIVERY_A")
          cat /tmp/document-a.json
          test "$upload_status" = "201"
          DOCUMENT_A=$(node -e "const fs=require('fs');process.stdout.write(JSON.parse(fs.readFileSync('/tmp/document-a.json','utf8')).id)")

          metadata_status=$(curl --silent --output /tmp/document-metadata-a.json --write-out "%{http_code}" \
            --cookie /tmp/cookies-a.txt \
            "http://127.0.0.1:3001/api/v1/documents/$DOCUMENT_A")
          cat /tmp/document-metadata-a.json
          test "$metadata_status" = "200"
          grep -q "$DELIVERY_A" /tmp/document-metadata-a.json

          content_status=$(curl --silent --output /tmp/document-content-a.bin --write-out "%{http_code}" \
            --cookie /tmp/cookies-a.txt \
            "http://127.0.0.1:3001/api/v1/documents/$DOCUMENT_A/content")
          test "$content_status" = "200"
          cmp /tmp/ticket-004281.txt /tmp/document-content-a.bin

          foreign_metadata_status=$(curl --silent --output /tmp/document-metadata-b.json --write-out "%{http_code}" \
            --cookie /tmp/cookies-b.txt \
            "http://127.0.0.1:3001/api/v1/documents/$DOCUMENT_A")
          test "$foreign_metadata_status" = "404"

          foreign_content_status=$(curl --silent --output /tmp/document-content-b.json --write-out "%{http_code}" \
            --cookie /tmp/cookies-b.txt \
            "http://127.0.0.1:3001/api/v1/documents/$DOCUMENT_A/content")
          test "$foreign_content_status" = "404"
          grep -q 'DOCUMENT_NOT_FOUND' /tmp/document-content-b.json

      - name: Verify campaign weighted summary and coverage
        run: |
          CAMPAIGN_A=$(node -e "const fs=require('fs');process.stdout.write(JSON.parse(fs.readFileSync('/tmp/campaign-a.json','utf8')).id)")

          second_delivery_status=$(curl --silent --output /tmp/delivery-second.json --write-out "%{http_code}" \
            --cookie /tmp/cookies-a.txt \
            --header 'content-type: application/json' \
            --header 'Idempotency-Key: 22222222-2222-4222-8222-222222222222' \
            --data '{"deliveredAt":"2026-11-21T09:00:00+01:00","kilograms":"1000.000","customDestination":"Cooperativa piloto"}' \
            "http://127.0.0.1:3001/api/v1/campaigns/$CAMPAIGN_A/deliveries")
          cat /tmp/delivery-second.json
          test "$second_delivery_status" = "201"

          summary_status=$(curl --silent --output /tmp/summary-a.json --write-out "%{http_code}" \
            --cookie /tmp/cookies-a.txt \
            "http://127.0.0.1:3001/api/v1/campaigns/$CAMPAIGN_A/summary")
          cat /tmp/summary-a.json
          test "$summary_status" = "200"

          foreign_summary_status=$(curl --silent --output /tmp/summary-by-b.json --write-out "%{http_code}" \
            --cookie /tmp/cookies-b.txt \
            "http://127.0.0.1:3001/api/v1/campaigns/$CAMPAIGN_A/summary")
          test "$foreign_summary_status" = "404"

          node - <<'NODE'
          const fs = require('fs');
          const summary = JSON.parse(fs.readFileSync('/tmp/summary-a.json', 'utf8'));
          if (summary.deliveriesCount !== 2) throw new Error(`Expected 2 deliveries, got ${summary.deliveriesCount}`);
          if (summary.totalKilograms !== '2842.000') throw new Error(`Unexpected total kg ${summary.totalKilograms}`);
          if (summary.deliveriesWithResult !== 1) throw new Error('Expected one delivery with result');
          if (summary.pendingResultCount !== 1) throw new Error('Expected one pending result');
          if (summary.resultCoveredKilograms !== '1842.000') throw new Error(`Unexpected covered kg ${summary.resultCoveredKilograms}`);
          if (summary.coveragePercent !== '64.8135') throw new Error(`Unexpected coverage ${summary.coveragePercent}`);
          if (summary.weightedYieldPercent !== '21.9000') throw new Error(`Unexpected weighted yield ${summary.weightedYieldPercent}`);
          NODE

      - name: Verify backup and clean restore
        run: bash scripts/spike-backup-restore.sh

      - name: Stop API
        if: always()
        run: |
          if [ -f /tmp/magina-api.pid ]; then
            kill "$(cat /tmp/magina-api.pid)" 2>/dev/null || true
          fi
          cat /tmp/magina-api.log 2>/dev/null || true
