name: Technical Spike Smoke

on:
  pull_request:
    branches:
      - feat/foundation-v1
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: technical-spike-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: magina_olivo
          POSTGRES_USER: magina
          POSTGRES_PASSWORD: magina_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U magina -d magina_olivo"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://magina:magina_ci@127.0.0.1:5432/magina_olivo
      BETTER_AUTH_SECRET: ci-only-secret-for-magina-olivo-technical-spike-2026
      BETTER_AUTH_URL: http://127.0.0.1:3001
      BETTER_AUTH_TRUSTED_ORIGINS: http://127.0.0.1:3001,http://localhost:5173
      DOCUMENT_STORAGE_DIR: /tmp/magina-private-documents
      HOST: 127.0.0.1
      PORT: 3001
      LOG_LEVEL: warn

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck workspaces
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Migrate Better Auth
        run: npm run auth:migrate --workspace @magina/api

      - name: Migrate business schema
        run: npm run db:migrate

      - name: Build web PWA
        run: npm run build --workspace @magina/web

      - name: Inspect frontend bundle for server secrets
        run: |
          if grep -R -E 'BETTER_AUTH_SECRET|DATABASE_URL|magina_ci|correct-horse-battery-staple' apps/web/dist; then
            echo 'Server-only secret material found in frontend bundle'
            exit 1
          fi

      - name: Start API
        run: |
          npm run start --workspace @magina/api > /tmp/magina-api.log 2>&1 &
          echo $! > /tmp/magina-api.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3001/health/ready > /tmp/ready.json; then
              cat /tmp/ready.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/magina-api.log
          exit 1

      - name: Verify API security and agricultural vertical slice
        run: bash scripts/spike-api-flow.sh

      - name: Stop API
        if: always()
        run: |
          if [ -f /tmp/magina-api.pid ]; then
            kill "$(cat /tmp/magina-api.pid)" 2>/dev/null || true
          fi
          cat /tmp/magina-api.log 2>/dev/null || true
