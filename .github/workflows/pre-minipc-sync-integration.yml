name: Sync Pre-MiniPC with Integration V2

on:
  push:
    branches:
      - feat/pre-minipc-convergence-v1
    paths:
      - .github/workflows/pre-minipc-sync-integration.yml

permissions:
  contents: write

jobs:
  sync-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout convergence branch
        uses: actions/checkout@v4
        with:
          ref: feat/pre-minipc-convergence-v1
          fetch-depth: 0

      - name: Merge latest Integration V2 safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "IsiVoltPro Mantenimiento"
          git config user.email "isiciozafracantos@gmail.com"
          git fetch origin feat/integration-v2-mvp-v1

          set +e
          git merge --no-commit --no-ff origin/feat/integration-v2-mvp-v1
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            echo "Conflicts detected:"
            echo "$conflicts"
            unexpected="$(printf '%s\n' "$conflicts" | grep -Ev '^(apps/web/src/MaginaWeatherPage.tsx|apps/web/src/main.tsx)$' || true)"
            if [ -n "$unexpected" ]; then
              echo "Unexpected conflicts; aborting without pushing."
              git merge --abort
              exit 1
            fi

            if printf '%s\n' "$conflicts" | grep -qx 'apps/web/src/MaginaWeatherPage.tsx'; then
              git checkout --theirs apps/web/src/MaginaWeatherPage.tsx
            fi
            if printf '%s\n' "$conflicts" | grep -qx 'apps/web/src/main.tsx'; then
              git checkout --ours apps/web/src/main.tsx
            fi
          fi

          python <<'PY'
          from pathlib import Path
          import re

          weather_path = Path('apps/web/src/MaginaWeatherPage.tsx')
          weather = weather_path.read_text(encoding='utf-8')
          public_header_import = "import { PublicHeader } from './publicNavigation';\n"
          if public_header_import not in weather:
              first_import_end = weather.find('\n') + 1
              weather = weather[:first_import_end] + public_header_import + weather[first_import_end:]

          header_pattern = r'      <header className="directory-header">[\s\S]*?      </header>'
          if '<PublicHeader />' not in weather:
              weather, count = re.subn(header_pattern, '      <PublicHeader />', weather, count=1)
              if count != 1:
                  raise SystemExit('Could not restore shared PublicHeader in weather page')
          weather_path.write_text(weather, encoding='utf-8')

          main_path = Path('apps/web/src/main.tsx')
          main = main_path.read_text(encoding='utf-8')
          weather_import = "import { installWeatherDemoPreview } from './weatherDemoPreview';\n"
          if weather_import not in main:
              anchor = "import { ResetPassword } from './ResetPassword';\n"
              if anchor not in main:
                  raise SystemExit('ResetPassword import anchor not found')
              main = main.replace(anchor, anchor + weather_import, 1)

          weather_install = 'installWeatherDemoPreview();\n'
          if weather_install not in main:
              anchor = 'installDemoPreview();\n'
              if anchor not in main:
                  raise SystemExit('installDemoPreview anchor not found')
              main = main.replace(anchor, anchor + weather_install, 1)
          main_path.write_text(main, encoding='utf-8')
          PY

          git add -A
          if git diff --cached --quiet; then
            echo "Integration V2 already synchronized"
            git merge --abort 2>/dev/null || true
            exit 0
          fi

          git commit -m "merge(convergence): sync latest Integration V2"
          git push origin HEAD:feat/pre-minipc-convergence-v1
