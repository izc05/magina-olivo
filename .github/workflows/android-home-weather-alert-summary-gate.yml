name: Android Home Weather Alert Summary Gate

on:
  push:
    branches:
      - feat/android-home-weather-alert-summary-v1
  pull_request:
    branches:
      - integration/android-ui-weather-v1
    paths:
      - "app/src/main/java/com/isivolt/maginaolivo/ui/home/**"
      - "app/src/main/java/com/isivolt/maginaolivo/ui/shell/**"
      - "app/src/main/java/com/isivolt/maginaolivo/ui/MaginaOlivoRoot.kt"
      - "app/src/test/java/com/isivolt/maginaolivo/ui/home/**"
      - "docs/ANDROID_HOME_WEATHER_ALERT_SUMMARY_V1.md"
      - ".github/workflows/android-home-weather-alert-summary-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-home-weather-alert-summary-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  alert-summary:
    name: Android Home Weather Alert Summary Gate
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Android SDK 36
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Verify alert summary ownership
        shell: bash
        run: |
          set -eu
          test -f app/src/main/java/com/isivolt/maginaolivo/ui/home/HomeWeatherAlertContract.kt
          test -f app/src/main/java/com/isivolt/maginaolivo/ui/home/WeatherRepositoryHomeAlertSummarySource.kt
          test -f app/src/test/java/com/isivolt/maginaolivo/ui/home/WeatherRepositoryHomeAlertSummarySourceTest.kt
          grep -q 'WeatherPlanningAlertEngine.evaluate' app/src/main/java/com/isivolt/maginaolivo/ui/home/WeatherRepositoryHomeAlertSummarySource.kt
          grep -q 'settingsProvider' app/src/main/java/com/isivolt/maginaolivo/ui/home/WeatherRepositoryHomeAlertSummarySource.kt

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build debug
        run: gradle :app:assembleDebug --stacktrace
