name: Convergence browser smoke

on:
  push:
    branches:
      - feat/pre-minipc-convergence-v1
      - fix/pre-minipc-browser-smoke-v1
  pull_request:
    branches:
      - feat/pre-minipc-convergence-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: convergence-browser-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck workspaces
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build isolated demo preview
        env:
          VITE_BASE_PATH: /magina-olivo/
          VITE_DEMO_MODE: "true"
        run: npm run build --workspace @magina/web

      - name: Install browser smoke dependency
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start preview server
        run: |
          npm run preview --workspace @magina/web -- --host 127.0.0.1 --port 4173 > /tmp/magina-preview.log 2>&1 &
          echo $! > /tmp/magina-preview.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/magina-olivo/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/magina-preview.log
          exit 1

      - name: Run Chromium mobile smoke
        env:
          MAGINA_PREVIEW_URL: http://127.0.0.1:4173/magina-olivo/
        run: node scripts/convergence-browser-smoke.mjs

      - name: Show preview log on failure
        if: failure()
        run: cat /tmp/magina-preview.log || true
