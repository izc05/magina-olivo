<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2E3A22" />
    <meta name="description" content="Mágina Olivo — la herramienta digital del olivar." />
    <title>Mágina Olivo</title>
    <script>
      // GitHub Pages review: remove the obsolete service worker created by the
      // temporary integration preview. It used /magina-olivo/ as its scope and
      // could therefore keep serving the wrong cached application after deploys.
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', async () => {
          try {
            const registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(
              registrations
                .filter((registration) => registration.scope.includes('/magina-olivo/'))
                .map((registration) => registration.unregister()),
            );

            if ('caches' in window) {
              const keys = await caches.keys();
              await Promise.all(
                keys
                  .filter((key) => key.includes('magina-olivo') || key === 'magina-public-api-v1')
                  .map((key) => caches.delete(key)),
              );
            }
          } catch (error) {
            console.warn('No se pudo limpiar la preview PWA anterior.', error);
          }
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
