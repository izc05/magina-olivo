name: Mágina Olivo original app review

on:
  push:
    branches:
      - feat/visual-v2-foundation
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: magina-olivo-original-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout original Visual V2 app
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Generate approved photography
        run: npm run photos:sync

      - name: Build original app for GitHub Pages
        run: npm run build -- --base=/magina-olivo/

      - name: Prepare Pages review build
        run: |
          cp dist/index.html dist/404.html
          cp dist/index.html dist/visual-v2-review.html
          printf '{"source":"feat/visual-v2-foundation","commit":"%s"}\n' "$GITHUB_SHA" > dist/review-build.json
          touch dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    environment:
      name: pages-original-review
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy original Mágina Olivo review app
        id: deployment
        uses: actions/deploy-pages@v4
