name: Android Emulator Smoke

on:
  push:
    branches:
      - "feat/android-map-catastro-v1"
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-emulator-smoke.yml"
      - ".github/scripts/android-smoke-ui.py"
  pull_request:
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-emulator-smoke.yml"
      - ".github/scripts/android-smoke-ui.py"

concurrency:
  group: android-emulator-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot emulator and smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            set -eu

            adb_recover() {
              adb kill-server >/dev/null 2>&1 || true
              sleep 2
              adb start-server
              adb wait-for-device
              i=0
              while [ "$i" -lt 20 ]; do
                if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
                  return 0
                fi
                i=$((i + 1))
                sleep 2
              done
              echo "::error::Emulator did not become ready after ADB recovery"
              return 1
            }

            adb_safe() {
              if "$@"; then
                return 0
              fi
              echo "::warning::ADB command failed once; recovering ADB and retrying"
              adb_recover
              "$@"
            }

            gradle :app:installDebug --stacktrace

            adb_recover
            adb_safe adb shell settings put global hide_error_dialogs 1
            adb_safe adb logcat -c
            adb_safe adb shell am force-stop com.isivolt.maginaolivo
            adb_safe adb shell am start -W -n com.isivolt.maginaolivo/.MainActivity
            sleep 3

            adb_safe adb shell uiautomator dump /sdcard/home.xml
            adb_safe adb pull /sdcard/home.xml /tmp/home.xml

            python3 .github/scripts/android-smoke-ui.py tap /tmp/home.xml "Abrir mapa de parcelas"

            sleep 5
            adb_safe adb shell uiautomator dump /sdcard/map.xml
            adb_safe adb pull /sdcard/map.xml /tmp/map.xml

            python3 .github/scripts/android-smoke-ui.py assert /tmp/map.xml "Volver" "Mi ubicación" "PNOA" "Catastro"
            echo "ANDROID_MAP_SMOKE_OK"

            adb_safe adb exec-out screencap -p > /tmp/map-smoke.png
            adb_safe adb logcat -d > /tmp/map-smoke-logcat.txt

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-map-smoke-evidence
          if-no-files-found: ignore
          path: |
            /tmp/home.xml
            /tmp/map.xml
            /tmp/map-smoke.png
            /tmp/map-smoke-logcat.txt
