name: Mágina Olivo integration preview validation

on:
  push:
    branches:
      - feat/integration-v2-mvp-v1
      - feat/pre-minipc-convergence-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: magina-olivo-integration-preview-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck workspaces
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build integration preview
        env:
          VITE_BASE_PATH: /magina-olivo/
          VITE_DEMO_MODE: "true"
        run: npm run build --workspace @magina/web

      - name: Keep integration preview off public Pages
        run: echo "Public GitHub Pages remains on Visual V2 until convergence matches the approved interface."
