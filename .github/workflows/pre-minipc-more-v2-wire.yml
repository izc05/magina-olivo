name: Wire Pre-MiniPC Mi Magina V2

on:
  push:
    branches:
      - feat/pre-minipc-convergence-v1
    paths:
      - .github/workflows/pre-minipc-more-v2-wire.yml

permissions:
  contents: write

jobs:
  wire-more-v2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout convergence branch
        uses: actions/checkout@v4
        with:
          ref: feat/pre-minipc-convergence-v1

      - name: Wire MoreDashboardV2 into authenticated app
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          path = Path('apps/web/src/App.tsx')
          source = path.read_text(encoding='utf-8')

          more_import = "import { MoreDashboardV2 } from './MoreDashboardV2';\n"
          anchor = "import { MaginaPrivateHub } from './MaginaPrivateHub.tsx';\n"
          if more_import not in source:
              if anchor not in source:
                  raise SystemExit('MaginaPrivateHub import anchor not found')
              source = source.replace(anchor, anchor + more_import, 1)

          replacement = """function MoreTab({ user, holding, busy, onSignOut }: { user: User; holding: Holding | null; busy: boolean; onSignOut: () => void }) {
            return <MoreDashboardV2 user={user} holding={holding} busy={busy} onSignOut={onSignOut} />;
          }

          function PageIntro"""

          pattern = r'function MoreTab\([\s\S]*?\n}\n\nfunction PageIntro'
          source, count = re.subn(pattern, replacement, source, count=1)
          if count != 1:
              raise SystemExit('MoreTab function block not found')

          path.write_text(source, encoding='utf-8')
          PY

      - name: Commit Mi Magina wiring
        run: |
          git config user.name "IsiVoltPro Mantenimiento"
          git config user.email "isiciozafracantos@gmail.com"
          git add apps/web/src/App.tsx
          if git diff --cached --quiet; then
            echo "Mi Magina V2 already wired"
            exit 0
          fi
          git commit -m "feat(convergence): wire Visual V2 Mi Magina to real account"
          git push origin HEAD:feat/pre-minipc-convergence-v1
