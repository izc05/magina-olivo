name: Android Catastro Room E2E

on:
  workflow_dispatch:
  push:
    branches:
      - "feat/android-map-catastro-v1"
    paths:
      - "app/**"
      - "supabase/functions/catastro-map/**"
      - ".github/workflows/android-catastro-room-e2e.yml"
  pull_request:
    paths:
      - "app/**"
      - "supabase/functions/catastro-map/**"
      - ".github/workflows/android-catastro-room-e2e.yml"

concurrency:
  group: android-catastro-room-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SUPABASE_URL: https://zzelvbcuxsboafibfxch.supabase.co
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Require Supabase publishable key
        shell: bash
        run: |
          if [[ -z "${SUPABASE_PUBLISHABLE_KEY}" ]]; then
            echo "::error::Missing GitHub Actions secret SUPABASE_PUBLISHABLE_KEY"
            exit 1
          fi

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Catastro to Room E2E
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: gradle :app:connectedDebugAndroidTest --info --stacktrace

      - name: Upload Android E2E test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-catastro-room-e2e-reports
          if-no-files-found: ignore
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
