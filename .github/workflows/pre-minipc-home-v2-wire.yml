name: Wire Pre-MiniPC Home V2

on:
  push:
    branches:
      - feat/pre-minipc-convergence-v1
    paths:
      - .github/workflows/pre-minipc-home-v2-wire.yml

permissions:
  contents: write

jobs:
  wire-home-v2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout convergence branch
        uses: actions/checkout@v4
        with:
          ref: feat/pre-minipc-convergence-v1

      - name: Wire HomeDashboardV2 into App and CSS bundle
        shell: python
        run: |
          from pathlib import Path

          app_path = Path('apps/web/src/App.tsx')
          app = app_path.read_text(encoding='utf-8')

          home_import = "import { HomeDashboardV2 } from './HomeDashboardV2';\n"
          field_import = "import { FieldNotebook } from './FieldNotebook.tsx';\n"
          if home_import not in app:
              if field_import not in app:
                  raise SystemExit('FieldNotebook import anchor not found')
              app = app.replace(field_import, field_import + home_import, 1)

          old_home = "{tab === 'home' ? <HomeTab holding={selectedHolding} campaign={selectedCampaign} summary={summary} coverage={coverage} onNavigate={setTab} /> : null}"
          new_home = "{tab === 'home' ? <HomeDashboardV2 holding={selectedHolding} campaign={selectedCampaign} summary={summary} coverage={coverage} onNavigate={setTab} /> : null}"
          if new_home not in app:
              if old_home not in app:
                  raise SystemExit('HomeTab render anchor not found')
              app = app.replace(old_home, new_home, 1)

          app_path.write_text(app, encoding='utf-8')

          main_path = Path('apps/web/src/main.tsx')
          main = main_path.read_text(encoding='utf-8')
          css_import = "import './home-dashboard-v2.css';\n"
          css_anchor = "import './product-tour.css';\n"
          if css_import not in main:
              if css_anchor not in main:
                  raise SystemExit('Product tour CSS anchor not found')
              main = main.replace(css_anchor, css_anchor + css_import, 1)
          main_path.write_text(main, encoding='utf-8')

      - name: Commit wiring
        run: |
          git config user.name "IsiVoltPro Mantenimiento"
          git config user.email "isiciozafracantos@gmail.com"
          git add apps/web/src/App.tsx apps/web/src/main.tsx
          if git diff --cached --quiet; then
            echo "Home V2 already wired"
            exit 0
          fi
          git commit -m "feat(convergence): wire Visual V2 home to real data"
          git push origin HEAD:feat/pre-minipc-convergence-v1
