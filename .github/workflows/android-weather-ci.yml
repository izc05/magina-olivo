name: Android Weather CI

on:
  push:
    branches:
      - "feat/android-weather-v1"
    paths:
      - "app/**"
      - "supabase/functions/weather-forecast/**"
      - "supabase/config.toml"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-weather-ci.yml"
  workflow_dispatch:

concurrency:
  group: android-weather-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Android SDK 36
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build debug
        run: gradle :app:assembleDebug --stacktrace
